name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      HAYPILE_UI_LANG: zh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libpulse0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0
      - run: python -m pip install -U "pip==26.2"
      - run: python -m pip install --constraint constraints-release.txt -r requirements.txt
      - run: python examples/public_smoke_demo.py --out /tmp/haypile-demo-ci
      - run: python scripts/render_intake_visuals.py --out /tmp/haypile-intake-visuals
      - run: python scripts/render_hub_visuals.py --out /tmp/haypile-hub-visuals
      - run: python -m unittest tests/test_agent_examples.py tests/test_mcp_server.py
      - run: python -m unittest discover -s tests
