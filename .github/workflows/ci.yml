name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      HAYPILE_UI_LANG: zh
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # Includes the historical storage-compatibility fixture.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libpulse0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0
      - run: python -m pip install -U "pip==26.2"
      - run: python -m pip install --constraint constraints-release.txt -r requirements.txt
      - run: python examples/public_smoke_demo.py --out "${{ runner.temp }}/haypile-demo-ci"
      - run: python scripts/render_intake_visuals.py --out "${{ runner.temp }}/haypile-intake-visuals"
      - run: python scripts/render_hub_visuals.py --out "${{ runner.temp }}/haypile-hub-visuals"
      - run: python -m unittest tests/test_agent_examples.py tests/test_mcp_server.py
      - run: python -m unittest discover -s tests
      - name: Windows native window checks
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
        run: >-
          python -m unittest
          tests.test_attached_hub.AttachedHubTests.test_ring_has_native_hole_and_keeps_all_actions_on_screen
          tests.test_attached_hub.AttachedHubTests.test_ring_outside_click_closes_without_consuming_the_button_action
          tests.test_attached_hub.AttachedHubTests.test_windows_consumed_click_bit_does_not_dismiss_new_ring_or_card
          tests.test_attached_hub.AttachedHubTests.test_ring_action_opens_recent_card_and_closes_ring
          tests.test_attached_hub.AttachedHubTests.test_ring_keyboard_navigation_and_repeated_window_transitions
          tests.test_attached_hub.AttachedHubTests.test_card_and_management_keep_grass_origin
          tests.test_attached_hub.AttachedHubTests.test_hover_reentry_resumes_opening_without_another_dwell
          tests.test_attached_hub.AttachedHubTests.test_hover_animation_is_reused_and_repeated_open_does_not_restart
          tests.test_attached_hub.AttachedHubTests.test_hide_during_window_drag_allows_next_external_drop_hover
          tests.test_attached_hub.AttachedHubTests.test_double_click_toggles_once_per_release
